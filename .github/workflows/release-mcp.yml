name: Release MCP image
on:
  push:
    tags: ["mcp-v*.*.*", "mcp-test-*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true
      - run: uv sync --project mcp --locked
      - run: uv run --project mcp ruff check mcp
      - run: uv run --project mcp pytest mcp/tests
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-mcp"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/mcp-v* ]]; then
            echo "$image:${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT"
            echo "$image:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.18.0
        with:
          context: mcp
          push: true
          tags: ${{ steps.image.outputs.tags }}
          sbom: true
          provenance: mode=max
