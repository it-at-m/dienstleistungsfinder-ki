name: Release core image
on:
  push:
    tags: ["core-v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#core-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: core
          push: true
          tags: |
            ghcr.io/it-at-m/dienstleistungsfinder-ki-core:${{ steps.version.outputs.value }}
            ghcr.io/it-at-m/dienstleistungsfinder-ki-core:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
