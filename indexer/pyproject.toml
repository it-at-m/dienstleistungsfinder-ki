[project]
name = "dlf-indexer"
version = "0.1.0"
description = "Indexer zwischen stadt.muenchen.de-CMS und DLF-Vektordatenbank"
readme = "README.md"
requires-python = "==3.13.11"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Michael Jaumann", email = "michael.jaumann@muenchen.de" },
    { name = "Leon Lukas", email = "leon.lukas@muenchen.de" },
    { name = "Sebastian Berger", email = "sebastian.berger@muenchen.de" },
]
maintainers = [
    { name = "Sebastian Berger", email = "sebastian.berger@muenchen.de" },
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]

dependencies = [
    "langchain==1.3.18",
    "langchain-community==0.4.2",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.2",
    "qdrant-client[fastembed]==1.19.0",
    "python-dotenv==1.2.3",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.0",
    "pyyaml==6.0.3",
    "truststore==0.10.4",
    "langchain-openai==1.6.0",
    "pystemmer==3.1.0",
    "httpx==0.28.1",
    "stamina==26.1.0",
    "pandas==3.0.5",
]

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest==9.1.1",
    "pre-commit==4.6.2",
    "ipykernel==7.3.0",
    "jupyter==1.1.1",
    "datasets==5.0.1",
    "huggingface-hub==1.29.0",
    "ty==0.0.75",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "notebooks",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# All lint rules: https://docs.astral.sh/ruff/rules/
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
