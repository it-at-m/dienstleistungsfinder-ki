[project]
name = "dlf-search-mcp"
version = "0.1.0"
description = "MCP retrieval tool for the Dienstleistungsfinder KI backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==2.1.1",
    "httpx2==2.12.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "starlette>=0.48,<2",
]

[project.scripts]
dlf-search-mcp = "src.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.16.6"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
