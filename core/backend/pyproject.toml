[project]
name = "dlf-backend"
version = "0.1.0"
description = "KI-Suche der Stadt München (Backend)"
readme = "README.md"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Michael Jaumann", email = "michael.jaumann@muenchen.de" },
    { name = "Leon Lukas", email = "leon.lukas@muenchen.de" },
    { name = "Sebastian Berger", email = "sebastian.berger@muenchen.de" },
]
maintainers = [
    { name = "Sebastian Berger", email = "sebastian.berger@muenchen.de" },
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]
requires-python = "==3.14.9"
dependencies = [
    "fastapi==0.162.0",
    "gitpython==3.2.1",
    "itsdangerous==2.2.0",
    "langchain-openai==1.7.2",
    "langchain-qdrant==1.1.0",
    "langchain==1.4.7",
    "langfuse==5.0.4",
    "python-dotenv==1.2.4",
    "starlette==1.10.0",
    "qdrant-client[fastembed]==1.20.0",
    "truststore==0.10.5",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "aiosmtplib==5.1.3",
    "cohere==7.3.0",
    "fastmcp>=4.1.4",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
