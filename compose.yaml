services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.0
    env_file:
      - path: ./core/backend/.env
        required: true
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  core:
    build:
      context: ./core
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    env_file:
      - path: ./core/backend/.env
        required: true
    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: qdrant,localhost,127.0.0.1,${NO_PROXY:-}
      no_proxy: qdrant,localhost,127.0.0.1,${no_proxy:-}
    depends_on:
      - qdrant
    ports:
      - "8080:8080"
    # Mount custom CA certificates here if your network intercepts TLS, e.g.:
    # volumes:
    #   - ~/LHM-CA-v2.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro

  indexer:
    profiles: [indexer]
    build:
      context: ./indexer
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    env_file:
      - path: ./indexer/.env
        required: true
    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: qdrant,localhost,127.0.0.1,${NO_PROXY:-}
      no_proxy: qdrant,localhost,127.0.0.1,${no_proxy:-}
    depends_on:
      - qdrant
    # Mount custom CA certificates here if your network intercepts TLS, e.g.:
    # volumes:
    #   - ~/LHM-CA-v2.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro

volumes:
  qdrant-data:
